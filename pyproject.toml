[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mkdocs-onlinecompiler"
dynamic = ["version"]
description = "Runnable, interactive code blocks for MkDocs and Material for MkDocs: readers edit and run your code examples in Python, JavaScript, C++, Java, Go, SQL and 46 languages, right in the docs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RunCode Inc." }]
keywords = ["mkdocs", "mkdocs-plugin", "mkdocs-material", "material-for-mkdocs", "runnable code", "interactive code examples", "live code", "code playground", "run code", "code runner", "online compiler", "documentation", "python", "onlinecompiler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Framework :: MkDocs",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["mkdocs>=1.5"]

[project.urls]
Homepage = "https://onlinecompiler.io/guides/add-runnable-code-examples-to-mkdocs"
Documentation = "https://onlinecompiler.io/docs/widget"
Source = "https://github.com/onlinecompiler-io/mkdocs-onlinecompiler"
Issues = "https://github.com/onlinecompiler-io/mkdocs-onlinecompiler/issues"

[project.entry-points."mkdocs.plugins"]
onlinecompiler = "mkdocs_onlinecompiler.plugin:OnlineCompilerPlugin"

[tool.hatch.version]
path = "src/mkdocs_onlinecompiler/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mkdocs_onlinecompiler"]

[tool.hatch.build.targets.sdist]
exclude = [".github"]
