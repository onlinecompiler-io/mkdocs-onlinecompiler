name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.10"
            mkdocs: "mkdocs==1.5.*"
          - python: "3.12"
            mkdocs: "mkdocs==1.6.* mkdocs-material"
          - python: "3.14"
            mkdocs: "mkdocs mkdocs-material"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest ${{ matrix.mkdocs }}
      - run: pytest -q tests
